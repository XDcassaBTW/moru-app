name: Dev Build CI

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["dev"]

jobs:
  # --- NEW IOS JOB ---
  build-and-release-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build iOS (Unsigned)
        run: flutter build ios --release --no-codesign
      - name: Create IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Moru_iOS.ipa Payload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moru-iOS-IPA
          path: Moru_iOS.ipa

  # --- FIXED ANDROID JOB ---
  build-and-release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Decode keystore
        run: |
          echo $ENCODED_KEYSTORE | base64 -di > android/app/keystore.jks || echo "No keystore found, skipping signing"
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD}}
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Moru-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk

  # --- FIXED WINDOWS JOB ---
  build-and-release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moru-Windows-Build
          path: build/windows/x64/runner/Release/

  # --- FIXED LINUX JOB ---
  build-and-release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build build-essential libgtk-3-dev libmpv-dev mpv
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moru-Linux-Build
          path: build/linux/x64/release/bundle/
