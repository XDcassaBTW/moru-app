build-and-release-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          # Using a newer Flutter version to match your pubspec environment
          flutter-version: 3.22.0 
          channel: stable

      - name: Patch Dependencies
        run: |
          # 1. Remove the strict versioning for flutter_i18n
          sed -i '' 's/flutter_i18n: ^0.35.0/flutter_i18n: any/g' pubspec.yaml
          
          # 2. Inject dependency overrides at the end of the file
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  intl: any" >> pubspec.yaml
          
          # 3. Get dependencies
          flutter pub get

      - name: Build iOS Frameworks (No Sign)
        run: flutter build ios --release --no-codesign

      - name: Create Unsigned IPA
        run: |
          # The classic Payload trick for sideloading
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Miru-Unsigned.ipa Payload
          mkdir -p build/ios/release
          mv Miru-Unsigned.ipa build/ios/release/Miru-${{github.ref_name}}-ios-unsigned.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          path: "build/ios/release/Miru-${{github.ref_name}}-ios-unsigned.ipa"
          name: Miru-${{github.ref_name}}-ios-unsigned.ipa

      - name: Release Packages
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/ios/release/*.ipa"
          allowUpdates: true
          omitBody: true
